<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antrenda'ya katıl</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin:0 auto;padding:48px 24px;color:#0f172a;text-align:center;line-height:1.6}
h1{color:#0b1f3a;font-size:26px}.code{font-size:40px;letter-spacing:10px;font-weight:800;color:#0b1f3a;margin:8px 0 24px}
a.btn{display:block;margin:10px 0;padding:14px;border-radius:14px;background:#0ea5e9;color:#fff;text-decoration:none;font-weight:600}
a.alt{background:#e2e8f0;color:#0f172a}</style></head><body>
<h1>Antrenda'ya katıl</h1>
<p>Antrenör davet kodun:</p>
<div class="code" id="code">------</div>
<p>Uygulamayı indir, kayıt ol ve bu kodu gir.</p>
<a class="btn" id="store" href="#">Uygulamayı indir</a>
<a class="alt btn" id="other" href="#">Diğer mağaza</a>
<script>
var p=new URLSearchParams(location.search), c=(p.get('code')||p.get('coach')||'').toUpperCase();
if(c) document.getElementById('code').textContent=c;
var IOS='https://apps.apple.com/app/id6813067640';
var AND='https://play.google.com/store/apps/details?id=com.vetmanagerapp';
var isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
var isAnd=/Android/i.test(navigator.userAgent);
var s=document.getElementById('store'), o=document.getElementById('other');
s.href=isIOS?IOS:AND; o.href=isIOS?AND:IOS;
if(isIOS||isAnd) setTimeout(function(){location.href=s.href;},1200);
</script>
</body></html>
